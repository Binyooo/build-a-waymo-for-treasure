[project]
name = "boatbrain"
version = "0.1.0"
description = "Logic-gate ternary driving laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pygame-ce>=2.5,<3"]
[project.scripts]
boatbrain = "boatbrain.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["boatbrain"]
